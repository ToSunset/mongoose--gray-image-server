<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset=gbk>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录</title>
<style>
  :root {
    --bg-start: #0f172a;
    --bg-end:   #1e293b;
    --card-bg:  rgba(30, 41, 59, 0.7);
    --card-border: rgba(255,255,255,0.08);
    --primary:  #3b82f6;
    --primary-hover: #60a5fa;
    --text:     #e2e8f0;
    --text-dim: #94a3b8;
    --input-bg: rgba(15, 23, 42, 0.6);
    --radius:   16px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
    padding: 16px;
  }
  .card {
    width: 100%; max-width: 400px;
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 40px 32px 32px;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
  }
  .card h2 {
    text-align:center; color:var(--text);
    font-weight:600; font-size:24px; margin-bottom:8px;
  }
  .card .sub {
    text-align:center; color:var(--text-dim); font-size:14px; margin-bottom:32px;
  }
  .field { position:relative; margin-bottom:24px; }
  .field input {
    width:100%; padding:14px 14px 6px; font-size:16px;
    background:var(--input-bg); color:var(--text);
    border:1px solid rgba(255,255,255,0.12); border-radius:10px;
    outline:none; transition:border-color 0.2s;
  }
  .field input:focus { border-color:var(--primary); }
  .field label {
    position:absolute; left:14px; top:14px;
    color:var(--text-dim); font-size:16px;
    pointer-events:none; transition:0.2s ease;
  }
  .field input:focus + label,
  .field input:not(:placeholder-shown) + label {
    top:4px; font-size:11px; color:var(--primary);
  }
  .field input::placeholder { color:transparent; }
  .btn {
    width:100%; padding:12px; font-size:16px; font-weight:600;
    background:var(--primary); color:#fff; border:none; border-radius:10px;
    cursor:pointer; transition:background 0.2s, transform 0.1s;
  }
  .btn:hover { background:var(--primary-hover); }
  .btn:active { transform:scale(0.97); }
  .footer { text-align:center; margin-top:20px; font-size:13px; color:var(--text-dim); }
</style>
</head>
<body>
<div class="card">
  <h2>图像服务器</h2>
  <p class="sub">请输入账号密码登录</p>
  <form method="post" action="/login">
    <div class="field">
      <input type="text" id="user" name="user" placeholder=" " autocomplete="username">
      <label for="user">用户名</label>
    </div>
    <div class="field">
      <input type="password" id="password" name="password" placeholder=" " autocomplete="current-password">
      <label for="password">密码</label>
    </div>
    <button class="btn" type="submit">登录</button>
  </form>
  
</div>
</body>
</html>
