<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset=gbk>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>控制面板</title>
<style>
  :root {
    --bg:        #0f172a;
    --surface:   #1e293b;
    --surface2:  rgba(30,41,59,0.7);
    --border:    rgba(255,255,255,0.08);
    --primary:   #3b82f6;
    --primary-hover: #60a5fa;
    --text:      #e2e8f0;
    --text-dim:  #94a3b8;
    --radius:    14px;
    --shadow:    0 8px 32px rgba(0,0,0,0.3);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
    color: var(--text);
  }
  .navbar {
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 24px;
    background: var(--surface);
    border-bottom:1px solid var(--border);
  }
  .navbar h1 { font-size:20px; font-weight:600; }
  .navbar .status {
    display:flex; align-items:center; gap:6px;
    font-size:13px; color:var(--text-dim);
  }
  .navbar .dot {
    display:inline-block; width:8px; height:8px; border-radius:50%;
    background:#22c55e; transition:background 0.3s;
  }
  .navbar .dot.disconnected { background:#ef4444; }
  .navbar a {
    color:var(--text-dim); text-decoration:none; font-size:14px;
    transition:color 0.2s;
  }
  .navbar a:hover { color:var(--primary); }

  .container {
    max-width:1100px; margin:0 auto; padding:24px 16px;
    display:grid; grid-template-columns:1fr 400px; gap:24px;
  }

  .img-card {
    background: var(--surface2);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px;
    box-shadow:var(--shadow);
  }
  .img-card h3 { font-size:15px; color:var(--text-dim); margin-bottom:12px; font-weight:500; }
  .img-wrap {
    position:relative;
    border-radius:10px; overflow:hidden;
    background:#000;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
  }
  .img-wrap img {
    display:block; width:100%; height:auto;
    image-rendering:pixelated;
  }
  .img-loading {
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    color:var(--text-dim); font-size:14px;
    background:rgba(0,0,0,0.5);
    pointer-events:none; opacity:0;
    transition:opacity 0.3s;
  }

  .settings-card {
    background: var(--surface2);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:24px 20px;
    box-shadow:var(--shadow);
  }
  .settings-card h3 {
    font-size:16px; font-weight:600; margin-bottom:20px;
    padding-bottom:12px; border-bottom:1px solid var(--border);
  }
  .field { position:relative; margin-bottom:20px; }
  .field input {
    width:100%; padding:14px 14px 6px; font-size:16px;
    background:rgba(15,23,42,0.6); color:var(--text);
    border:1px solid rgba(255,255,255,0.12); border-radius:10px;
    outline:none; transition:border-color 0.2s;
  }
  .field input:focus { border-color:var(--primary); }
  .field label {
    position:absolute; left:14px; top:14px;
    color:var(--text-dim); font-size:16px;
    pointer-events:none; transition:0.2s ease;
  }
  .field input:focus + label,
  .field input:not(:placeholder-shown) + label {
    top:4px; font-size:11px; color:var(--primary);
  }
  .field input::placeholder { color:transparent; }
  .btn {
    width:100%; padding:12px; font-size:16px; font-weight:600;
    background:var(--primary); color:#fff; border:none; border-radius:10px;
    cursor:pointer; transition:background 0.2s, transform 0.1s;
  }
  .btn:hover { background:var(--primary-hover); }
  .btn:active { transform:scale(0.97); }

  @media (max-width:768px) {
    .container { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<!-- 导航栏：左侧标题，中间流状态指示灯，右侧退出登录 -->
<div class="navbar">
  <h1>实时图像监控</h1>
  <div class="status">
    <span class="dot" id="streamDot"></span>
    <span id="streamStatus">连接中...</span>
  </div>
  <a href="/logout">退出登录</a>
</div>

<div class="container">
  <!-- 左侧：图像预览（直连 multipart 流） -->
  <div class="img-card">
    <h3>灰度图像实时显示</h3>
    <div class="img-wrap">
      <!-- 优化5: img src 直接指向 /stream 长连接口
           浏览器通过 multipart/x-mixed-replace 自动解析推送帧，
           无需 JS 定时器轮询，消除定时器开销和后台标签页限流问题。
           每收到一个新帧，浏览器自动替换 img 内容（不闪烁、不断连）。 -->
      <img id="live" src="/stream" alt="实时图像">
      <div class="img-loading">等待画面...</div>
    </div>
  </div>

  <!-- 右侧：参数设置 -->
  <div class="settings-card">
    <h3>参数设置</h3>
    <form method="post" action="/config">
      <div class="field">
        <input type="number" id="w" name="width" placeholder=" " min="1" max="4096">
        <label for="w">宽度</label>
      </div>
      <div class="field">
        <input type="number" id="h" name="height" placeholder=" " min="1" max="4096">
        <label for="h">高度</label>
      </div>
      <div class="field">
        <input type="number" id="iv" name="interval" placeholder=" " min="1" max="10000" step="1">
        <label for="iv">生成间隔(毫秒)</label>
      </div>
      <button class="btn" type="submit">设置</button>
    </form>
  </div>
</div>

<script>
/* 优化6: 监听 img 的加载/错误事件，实现自动重连
   浏览器在 multipart 流断开时会触发 img.onerror，
   这里自动重新连接，保证画面持续刷新。 */
(function() {
  var img = document.getElementById("live");
  var dot = document.getElementById("streamDot");
  var statusText = document.getElementById("streamStatus");
  var reconnectTimer = null;

  function setConnected(ok) {
    dot.className = "dot" + (ok ? "" : " disconnected");
    statusText.textContent = ok ? "连接中..." : "断开重连";
  }

  // 连接成功（首次加载或重连后第一帧到达）
  img.onload = function() {
    setConnected(true);
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  };

  // 连接断开（服务器关闭、网络中断等）
  img.onerror = function() {
    setConnected(false);
    /* 优化7: 后台标签页限流解决
       multipart/x-mixed-replace 不受浏览器 requestAnimationFrame 节流影响，
       因为它是被动接收服务器推送，不依赖 JS 定时器。
       但如果断开，我们用指数退避重连，避免死循环 */
    if (!reconnectTimer) {
      reconnectTimer = setTimeout(function() {
        reconnectTimer = null;
        // 追加时间戳绕过浏览器缓存，强制发起新连接
        img.src = "/stream?t=" + new Date().getTime();
      }, 2000);
    }
  };

  // 初始加载时设置 loading 状态
  setConnected(false);
})();

/* 加载当前配置参数（与之前相同） */
function loadConfig() {
  fetch("/config_data")
    .then(r => r.json())
    .then(d => {
      document.getElementById("w").value = d.width;
      document.getElementById("h").value = d.height;
      // 将毫秒转换为整数显示
      document.getElementById("iv").value = Math.round(d.interval);
    });
}
loadConfig();
</script>
</body>
</html>
